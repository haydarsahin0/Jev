name: arXiv teşhis (geçici)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: arXiv istek varyantlarını dene
        run: python .github/probe_arxiv.py
