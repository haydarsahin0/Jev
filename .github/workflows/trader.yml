name: Jev Trader (tek tik)

# Dakikalik strateji zamanlanmis kosuyla calismaz: GitHub Actions cron'u en
# sik 5 dakikada bir tetiklenir, uzerine kuyruk gecikmesi biner ve her kosu
# yaklasik bir dakikasini kurulumla harcar. 1 dakikalik RSI kurali icin bot
# surekli calismali (kendi makineniz veya bir VPS):
#
#     python trader/bot.py --mode demo --loop 60 --publish
#
# Buradaki is yalnizca **elle** calisir: anahtarlarin ve baglantinin
# dogrulugunu Actions uzerinden tek bir tikle sinamak icindir.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Yurutme modu"
        required: false
        type: choice
        options: [paper, demo, testnet, live]
        default: paper
      symbols:
        description: "Semboller (virgulle)"
        required: false
        type: string
        default: ""
      interval:
        description: "Mum araligi, dakika (bos = 1)"
        required: false
        type: string
        default: ""
      mock:
        description: "Jev'i cagirma, sahte sinyal uret"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Emri hesapla ama gonderme"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jev-trader
  cancel-in-progress: false

jobs:
  trade:
    name: Tek tik
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Birim testleri
        run: python -m unittest discover -s tests

      - name: Tik
        env:
          # Anahtarlar yalnizca bu adimin ortamindadir; loglara, durum
          # dosyasina veya siteye hicbir sekilde yazilmaz.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          # Gercek para ancak bu depo degiskeni "yes" ise acilir.
          BYBIT_ALLOW_LIVE: ${{ vars.BYBIT_ALLOW_LIVE }}
          TRADER_MODE: ${{ inputs.mode }}
          TRADER_SYMBOLS: ${{ inputs.symbols }}
          TRADER_INTERVAL: ${{ inputs.interval }}
          TRADER_MOCK: ${{ inputs.mock }}
          TRADER_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args="--mode $TRADER_MODE --once"
          if [ -n "$TRADER_SYMBOLS" ]; then args="$args --symbols $TRADER_SYMBOLS"; fi
          if [ -n "$TRADER_INTERVAL" ]; then args="$args --interval $TRADER_INTERVAL"; fi
          if [ "$TRADER_MOCK" = "true" ]; then args="$args --mock"; fi
          if [ "$TRADER_DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python trader/bot.py $args

      - name: Durumu commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Yalnizca bot durumu commit edilir, baska hicbir dosya degil.
          git add site/data/trader.json
          if git diff --cached --quiet; then
            echo "Durum degismedi, commit atlandi."
            exit 0
          fi
          git commit -m "trader: elle calistirilan tik"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push basarili."
              exit 0
            fi
            echo "Push basarisiz (deneme $attempt), rebase ile tekrar deneniyor…"
            sleep $((attempt * 2))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done

          echo "Push 5 denemede basarisiz oldu." >&2
          exit 1
